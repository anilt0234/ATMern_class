<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grid Pattern</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}
.container{
    width:900px;
    background-color:beige;
    display:grid;
    grid-template-columns:repeat(12,1fr);
    gap:10px;
}
.child{
    background-color:rgb(83,236,69);
    display:flex;
    justify-content:center;
    align-items:center;
    height:70px; 
    font-size:22px; 
    color:white;
}
.child-1{grid-column-start:1;grid-column-end:13;}
.child-2{grid-column-start:1;grid-column-end:7;}
.child-3{grid-column-start:7;grid-column-end:13;}
.child-4{grid-column-start:1;grid-column-end:5;}
.child-5{grid-column-start:5;grid-column-end:9;}
.child-6{grid-column-start:9;grid-column-end:13;}
.child-7{grid-column-start:1;grid-column-end:4;}
.child-8{grid-column-start:4;grid-column-end:7;}
.child-9{grid-column-start:7;grid-column-end:10;}
.child-10{grid-column-start:10;grid-column-end:13;}
.child-11{grid-column-start:1;grid-column-end:3;}
.child-12{grid-column-start:3;grid-column-end:5;}
.child-13{grid-column-start:5;grid-column-end:7;}
.child-14{grid-column-start:7;grid-column-end:9;}
.child-15{grid-column-start:9;grid-column-end:11;}
.child-16{grid-column-start:11;grid-column-end:13;}
.child-17{grid-column-start:1;grid-column-end:2;}
.child-18{grid-column-start:2;grid-column-end:3;}
.child-19{grid-column-start:3;grid-column-end:4;}
.child-20{grid-column-start:4;grid-column-end:5;}
.child-21{grid-column-start:5;grid-column-end:6;}
.child-22{grid-column-start:6;grid-column-end:7;}
.child-23{grid-column-start:7;grid-column-end:8;}
.child-24{grid-column-start:8;grid-column-end:9;}
.child-25{grid-column-start:9;grid-column-end:10;}
.child-26{grid-column-start:10;grid-column-end:11;}
.child-27{grid-column-start:11;grid-column-end:12;}
.child-28{grid-column-start:12;grid-column-end:13;}
</style>
</head>
<body>

<div class="container">
    <div class="child child-1">1</div>

    <div class="child child-2">2</div>
    <div class="child child-3">3</div>

    <div class="child child-4" >4</div>
    <div class="child child-5" >5</div>
    <div class="child child-6" >6</div>

    <div class="child child-7" >7</div>
    <div class="child child-8" >8</div>
    <div class="child child-9" >9</div>
    <div class="child child-10" >10</div>

    <div class="child child-11" >11</div>
    <div class="child child-12" >12</div>
    <div class="child child-13" >13</div>
    <div class="child child-14" >14</div>
    <div class="child child-15" >15</div>
    <div class="child child-16" >16</div>

    <div class="child child-17" >17</div>
    <div class="child child-18" >18</div>
    <div class="child child-19" >19</div>
    <div class="child child-20" >20</div>
    <div class="child child-21" >21</div>
    <div class="child child-22" >22</div>
    <div class="child child-23" >23</div>
    <div class="child child-24" >24</div>
    <div class="child child-25" >25</div>
    <div class="child child-26" >26</div>
    <div class="child child-27" >27</div>
    <div class="child child-28" >28</div>
</div>

</body>
</html>
