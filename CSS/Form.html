<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Form</title>
    <style>
        body {
            background-color: #f2f2f2;
            font-family: Arial, sans-serif;
        }
        form {
            width: 350px;
            margin: 40px auto;
            background-color: #ffffff;
            padding: 20px;
            border-radius: 6px;
        }
        input, select, textarea {
            width: 100%;
            padding: 8px;
            margin-top: 6px;
        }
        textarea {
            resize: none;
            height: 80px;
        }
        input[type="radio"],
        input[type="checkbox"],
        input[type="color"] {
            width: auto;
        }
        input[type="submit"] {
            background-color: #2e7d32;
            color: white;
            border: none;
            cursor: pointer;
            padding: 10px;
        }
        input[type="submit"]:hover {
            background-color: #1b5e20;
        }
    </style>
</head>
<body>
   <marquee behaviour="" direction="">Hi,this is a Form</marquee>
   <form action="" method="">
     <input type="text" name="" id="" placeholder="Enter your name" required>
     <input type="email" mailId="" id="" placeholder="Enter your mail" required>
     <input type="password" mailId="" id="" placeholder="Enter your pswd" required>
     <input type="number" mailId="" id="" placeholder="Enter your Age" required>
     <input type="color" name="" id="">
     <input type="file" name="" id="">
     <input type="date" name="" id="">
     <input type="time" name="" id="">
     <input type="radio" name="gender" id=""> Male
     <input type="radio" name="gender" id=""> Female
     <select name="" id="">
        <option value="Veg">Veg</option>
        <option value="Non-Veg">Non-Veg</option>
        <option value="Vegan">Vegan</option>
        <option value="Egetarian">Egeterian</option>
     </select>
     <textarea name="" id="" placeholder="Enter your message"></textarea>
     <input type="checkbox" name="" id=""> I agree
     <input type="submit" value="Submit">
   </form>
</body>
</html>
