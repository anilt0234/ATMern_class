            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        .container{
            width: 600px;
            height: 600px;
            background-color: beige;
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 10px;
            padding:10px;
        }

        .container div{
             overflow:hidden;
        }

        .container div img{
            width:100%;
            height:100%;
            object-fit:cover;
            transition: transform 0.4s ease;
        }

        .container div:hover img{
            transform: scale(1.15);
        }

        .child-1{
            /* background-color: rgb(83, 236, 69); */
