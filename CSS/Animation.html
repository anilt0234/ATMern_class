<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
           *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        
        .container{
            width: 500px;
            height: 500px;
            background-color: beige;
            display:flex;
            justify-content: center;
            align-items: center;
            animation: jump 1s infinite ease-in-out;
            
        }

        .ball{
            width: 100px;
            height: 100px;
            border-radius: 70%;
            background-color: rgb(28, 190, 82);
            display: flex;
            justify-content: center;
            align-items: center;


        }
       
     @keyframes jump {
        0% {
            transform: translateY(0px);
        }
        50% {
            transform: translateY(500px);
        }
        0% {
            transform: translateY(0px);
        }

        
     }
    </style>
</head>
<body>
    <div class="container">
        <div class="ball">  India vs NZ</div>
        
    </div>
</body>
</html>
